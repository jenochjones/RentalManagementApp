{% extends'base.html'%}{% block body %}<h1>Change {{x.category}}</h1>
<form method="post" class="form panel"><label>New monthly amount<input type="number" step=".01" name="monthly_amount"
            value="{{x.monthly_amount}}" required></label><label>Effective date<input type="date" name="effective_start"
            required></label><label>Description<input name="description"
            value="{{x.description}}"></label><button>Record change</button></form>{% endblock %}
