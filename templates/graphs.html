{% extends 'base.html' %}
{% block body %}
<h1>Graphs</h1>
<div class="panel">
  <p>Compare the original amortization schedule against the current schedule, along with the running net income/loss trend.</p>
  <canvas id="amChart" width="1000" height="500"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script>
const original = {{ original|tojson|safe }};
const modified = {{ rows|tojson|safe }};

function buildSeries(data, field) {
  return (data || []).map(r => ({ x: r.date, y: Number(r[field] || 0) }));
}

const ctx = document.getElementById('amChart').getContext('2d');

new Chart(ctx, {
  type: 'line',
  data: {
    datasets: [
      {
        label: 'Balance (current schedule)',
        data: buildSeries(modified, 'balance'),
        borderColor: 'rgba(75,192,192,1)',
        backgroundColor: 'rgba(75,192,192,0.1)',
        parsing: false,
        tension: 0.2,
      },
      {
        label: 'Balance (original)',
        data: buildSeries(original, 'balance'),
        borderColor: 'rgba(192,75,75,1)',
        backgroundColor: 'rgba(192,75,75,0.1)',
        borderDash: [6,4],
        parsing: false,
        tension: 0.2,
      },
      {
        label: 'Running net income/loss',
        data: buildSeries(modified, 'running'),
        borderColor: 'rgba(75,75,192,1)',
        backgroundColor: 'rgba(75,75,192,0.05)',
        parsing: false,
        tension: 0.2,
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    scales: {
      x: {
        type: 'time',
        time: {
          unit: 'month',
          tooltipFormat: 'MMM yyyy',
          displayFormats: {
            month: 'MMM yyyy'
          }
        },
        ticks: {
          autoSkip: true,
          maxRotation: 0,
          callback: function(value, index, ticks) {
            const date = this.getLabelForValue(value);
            return date;
          }
        },
        adapters: {
          date: { zone: 'UTC' }
        },
        title: {
          display: true,
          text: 'Date (Month Year)'
        }
      },
      y: {
        title: { display: true, text: 'Amount ($)' },
        ticks: {
          callback: function(value) {
            return '$' + Number(value).toLocaleString(undefined, { maximumFractionDigits: 0 });
          }
        }
      }
    },
    interaction: {
      mode: 'index',
      intersect: false,
    },
    plugins: {
      tooltip: {
        callbacks: {
          title: function(context) {
            const dt = new Date(context[0].parsed.x);
            return dt.toLocaleString(undefined, { month: 'short', year: 'numeric' });
          },
          label: function(context) {
            const v = context.parsed.y;
            return context.dataset.label + ': $' + Number(v).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
          }
        }
      }
    }
  }
});
</script>
{% endblock %}
